spring:
  application:
    name: wavebiz-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wavebiz}
    username: ${POSTGRES_USER:wavebiz}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
